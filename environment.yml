name: ci
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Numba 0.67 supports NumPy 2.2, which is required by the UMAP notebooks.
  - numpy=2.2
  - pandas=2.2
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel
  - tqdm
  - ipython
  - scikit-learn
  - pytorch
  - torchvision
  - tensorboard
  - pillow
  - rdkit
  - umap-learn
  - numba=0.67
  - pyarrow
  - requests
  - beautifulsoup4
  - pip
  - pip:
      - nistchempy==2.0.0
      - pubchempy==1.0.4
      - cirpy==1.0.2
